o-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" xml:space="preserve">event: Purchase</text><text x="60" y="504" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" xml:space="preserve">eventID: a8f3c</text><rect x="346" y="416" width="290" height="110" rx="14" fill="#fff" stroke="#4f46e5" stroke-width="2"/><text x="362" y="446" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="start" xml:space="preserve">サーバー（CAPI）</text><text x="362" y="476" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" xml:space="preserve">event_name: Purchase</text><text x="362" y="504" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" xml:space="preserve">event_id: order_123</text><text x="340.0" y="570" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#e11d48" text-anchor="middle" xml:space="preserve">Metaでは 2件 として計上（二重）</text><text x="340.0" y="634" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve">重複排除の対象は、最初のイベントから48時間以内に届いたもの</text></svg>
