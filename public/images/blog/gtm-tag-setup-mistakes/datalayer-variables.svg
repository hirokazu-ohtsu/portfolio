<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660" role="img" aria-label="dataLayerのキーとGTMのデータレイヤー変数名は一字一句一致させる"><title>dataLayerのキーとGTMのデータレイヤー変数名は一字一句一致させる</title><defs></defs><rect width="680" height="660" fill="#ffffff"/><text x="340.0" y="46" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" xml:space="preserve">dataLayerのキー名とGTMの変数名をそろえる</text><text x="24" y="92" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="start" xml:space="preserve">サイト側（dataLayer.push）</text><rect x="24" y="106" width="632" height="214" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="48" y="136" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">dataLayer.push({</text><text x="48" y="160" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">  event: &#x27;purchase&#x27;,</text><text x="48" y="184" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">  ecommerce: {</text><text x="48" y="208" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">    transaction_id: &#x27;T12345&#x27;,</text><text x="48" y="232" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">    value: 5000,</text><text x="48" y="256" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">    currency: &#x27;JPY&#x27;</text><text x="48" y="280" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">  }</text><text x="48" y="304" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">});</text><text x="24" y="362" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="start" xml:space="preserve">GTM側（データレイヤー変数の「変数名」）</text><rect x="24" y="380" width="632" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="44" y="414" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">ecommerce.transaction_id</text><text x="632" y="414" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="19" font-weight="700" fill="#059669" text-anchor="end" xml:space="preserve">✓ T12345</text><rect x="24" y="440" width="632" height="52" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="44" y="474" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">transactionId</text><text x="632" y="474" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="19" font-weight="700" fill="#e11d48" text-anchor="end" xml:space="preserve">✗ undefined</text><rect x="24" y="500" width="632" height="52" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="44" y="534" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">value</text><text x="632" y="534" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="19" font-weight="700" fill="#e11d48" text-anchor="end" xml:space="preserve">✗ undefined</text><rect x="24" y="560" width="632" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="44" y="594" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">ecommerce.value</text><text x="632" y="594" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="19" font-weight="700" fill="#059669" text-anchor="end" xml:space="preserve">✓ 5000（数値）</text><text x="340.0" y="646" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve">入れ子のキーは ecommerce.value のようにドットでつなぐ</text></svg>
